services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-axonize}
      POSTGRES_USER: ${POSTGRES_USER:-axonize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axonize}
    networks:
      - axonize-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axonize}"]
      interval: 5s
      timeout: 3s
      retries: 10

  axonize-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "${AXONIZE_GRPC_PORT:-4317}:4317"
      - "${AXONIZE_HTTP_PORT:-8080}:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-axonize}
      POSTGRES_USER: ${POSTGRES_USER:-axonize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-axonize}
      AXONIZE_API_KEY: ${AXONIZE_API_KEY:-}
      AXONIZE_AUTH_MODE: ${AXONIZE_AUTH_MODE:-static}
      AXONIZE_ADMIN_KEY: ${AXONIZE_ADMIN_KEY:-}
    networks:
      - axonize-net
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres-data:

networks:
  axonize-net:
    driver: bridge
